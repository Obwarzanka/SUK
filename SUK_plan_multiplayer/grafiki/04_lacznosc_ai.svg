<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#087f86"/></marker></defs>
<rect width="1400" height="850" fill="#eef3f7"/><rect width="1400" height="118" fill="#17334d"/>
<g font-family="Arial, sans-serif"><text x="48" y="53" fill="white" font-size="34" font-weight="700">SUK / człowiek, urządzenia i AI</text>
<text x="48" y="90" fill="#c4e6e9" font-size="21">AI ruchowe = algorytm danych i reguł, bez LLM. Rozwój po odbiorze infrastruktury.</text><rect x="50" y="185" width="360" height="190" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="185" width="7" height="190" rx="3" fill="#087f86"/><text x="74" y="227" font-size="25" font-weight="700" fill="#233c51">Urządzenie człowieka</text><text x="74" y="267" font-size="22" fill="#587082">Telefon / radio / tekst</text><text x="74" y="299" font-size="22" fill="#587082">Jawny odbiorca i rozmowa</text><text x="74" y="331" font-size="22" fill="#587082">Potwierdzenia proceduralne</text><rect x="520" y="185" width="360" height="190" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="520" y="185" width="7" height="190" rx="3" fill="#087f86"/><text x="544" y="227" font-size="25" font-weight="700" fill="#233c51">Router łączności</text><text x="544" y="267" font-size="22" fill="#587082">Sprawdza endpoint i ACL</text><text x="544" y="299" font-size="22" fill="#587082">Tekst + komunikat domenowy</text><text x="544" y="331" font-size="22" fill="#587082">Głos kieruje osobno</text><rect x="990" y="185" width="360" height="190" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="990" y="185" width="7" height="190" rx="3" fill="#087f86"/><text x="1014" y="227" font-size="25" font-weight="700" fill="#233c51">Algorytm ruchu (AI)</text><text x="1014" y="267" font-size="22" fill="#587082">Ten sam format rozmowy</text><text x="1014" y="299" font-size="22" fill="#587082">Dane + reguły + jawny stan</text><text x="1014" y="331" font-size="22" fill="#587082">Bez samowoli KZ</text><path d="M410,275 L520,275" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M880,275 L990,275" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="550" width="360" height="175" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="550" width="7" height="175" rx="3" fill="#087f86"/><text x="74" y="592" font-size="25" font-weight="700" fill="#233c51">Serwer mediów</text><text x="74" y="632" font-size="22" fill="#587082">Sprawdzony stos audio</text><text x="74" y="664" font-size="22" fill="#587082">Nie przez tick / SignalR</text><rect x="520" y="550" width="360" height="175" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="520" y="550" width="7" height="175" rx="3" fill="#087f86"/><text x="544" y="592" font-size="25" font-weight="700" fill="#233c51">Pipeline komend + KZ</text><text x="544" y="632" font-size="22" fill="#587082">To samo co dla człowieka</text><text x="544" y="664" font-size="22" fill="#587082">Prawa i zależności</text><rect x="990" y="550" width="360" height="175" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="990" y="550" width="7" height="175" rx="3" fill="#087f86"/><text x="1014" y="592" font-size="25" font-weight="700" fill="#233c51">Propozycja działania</text><text x="1014" y="632" font-size="22" fill="#587082">Polecenie z lease</text><text x="1014" y="664" font-size="22" fill="#587082">Budżet czasu/CPU</text><path d="M230,375 L230,550" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="288" y="472" text-anchor="middle" font-size="20" fill="#087f86">audio</text><path d="M1170,375 L1170,550" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M990,635 L880,635" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="810" font-size="20" fill="#587082">Singleplayer: te same interfejsy lokalnie, AI wyłącznie na stycznych poza obszarem gracza.</text></g></svg>