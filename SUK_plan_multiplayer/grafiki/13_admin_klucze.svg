<text x="50" y="700" font-size="23" fill="#17334d" font-weight="700">Revoke / utrata urządzenia → odcięcie sesji → nowy zatwierdzony enrollment.</text>
<text x="50" y="750" font-size="21" fill="#547084">Sam EXE, hasło albo publiczny certyfikat nie wystarczają. Rejestracja nie nadaje roli.</text>
<text x="50" y="797" font-size="21" fill="#547084">TPM nie chroni przed użyciem klucza przez przejętą sesję. Profil i odzyskanie: D18; próby: N41.</text>
