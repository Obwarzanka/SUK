<g font-family="Arial, sans-serif"><text x="48" y="53" fill="white" font-size="34" font-weight="700">SUK / przekazanie sterowania</text>
<text x="48" y="90" fill="#c4e6e9" font-size="21">Podgląd nadzorcy nie oznacza własności urządzeń.</text><rect x="50" y="185" width="360" height="180" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="185" width="7" height="180" rx="3" fill="#087f86"/><text x="74" y="227" font-size="25" font-weight="700" fill="#233c51">1  Obecny właściciel</text><text x="74" y="267" font-size="22" fill="#587082">Steruje odcinkiem</text><text x="74" y="299" font-size="22" fill="#587082">controlEpoch = 7</text><rect x="520" y="185" width="360" height="180" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="520" y="185" width="7" height="180" rx="3" fill="#087f86"/><text x="544" y="227" font-size="25" font-weight="700" fill="#233c51">2  Prośba</text><text x="544" y="267" font-size="22" fill="#587082">Nowy dyżurny żąda</text><text x="544" y="299" font-size="22" fill="#587082">konkretnego obszaru</text><rect x="990" y="185" width="360" height="180" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="990" y="185" width="7" height="180" rx="3" fill="#087f86"/><text x="1014" y="227" font-size="25" font-weight="700" fill="#233c51">3  Zgoda</text><text x="1014" y="267" font-size="22" fill="#587082">Właściciel akceptuje</text><text x="1014" y="299" font-size="22" fill="#587082">Serwer sprawdza prawa</text><path d="M410,275 L520,275" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M880,275 L990,275" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="535" width="360" height="180" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="535" width="7" height="180" rx="3" fill="#087f86"/><text x="74" y="577" font-size="25" font-weight="700" fill="#233c51">6  Nowy właściciel</text><text x="74" y="617" font-size="22" fill="#587082">Nowy przydział aktywny</text><text x="74" y="649" font-size="22" fill="#587082">Nadzorca widzi zmianę</text><rect x="520" y="535" width="360" height="180" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="520" y="535" width="7" height="180" rx="3" fill="#087f86"/><text x="544" y="577" font-size="25" font-weight="700" fill="#233c51">5  Odebranie starych praw</text><text x="544" y="617" font-size="22" fill="#587082">Komendy i potwierdzenia</text><text x="544" y="649" font-size="22" fill="#587082">Media oraz subskrypcje</text><rect x="990" y="535" width="360" height="180" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="990" y="535" width="7" height="180" rx="3" fill="#b26f12"/><text x="1014" y="577" font-size="25" font-weight="700" fill="#233c51">4  Atomowa zmiana</text><text x="1014" y="617" font-size="22" fill="#587082">Jeden krok świata</text><text x="1014" y="649" font-size="22" fill="#587082">controlEpoch = 8</text><path d="M1170,365 L1170,535" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M990,625 L880,625" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M520,625 L410,625" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="810" font-size="20" fill="#587082">Przekazanie praw nie resetuje przebiegów, sygnałów ani pociągów. Procedury srk ustala właściciel.</text></g></svg>