<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10Z" fill="#087f86"/></marker></defs><rect width="1400" height="850" fill="#eef3f7"/><rect width="1400" height="118" fill="#17334d"/><g font-family="Arial,sans-serif"><text x="40" y="52" fill="white" font-weight="700" font-size="31">SUK / małe zadanie z własnym kontekstem</text><text x="40" y="91" fill="#c4e6e9" font-size="20">28 etapów nadrzędnych • 90 zadań dla osobnych czatów • pakiety i raporty</text><rect x="50" y="180" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="180" width="6" height="175" fill="#087f86"/><text x="68" y="215" fill="#17334d" font-size="23" font-weight="700">Rejestr zadań</text><text x="68" y="252" fill="#547084" font-size="20">90 ID i zależności</text><text x="68" y="281" fill="#547084" font-size="20">Jeden odebrany poprzednik</text><text x="68" y="310" fill="#547084" font-size="20">Status planned nie znaczy done</text><rect x="505" y="180" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="505" y="180" width="6" height="175" fill="#087f86"/><text x="523" y="215" fill="#17334d" font-size="23" font-weight="700">Pakiet wejściowy</text><text x="523" y="252" fill="#547084" font-size="20">Karta + prompt + źródła</text><text x="523" y="281" fill="#547084" font-size="20">Raport i hashe kontraktów</text><text x="523" y="310" fill="#547084" font-size="20">Czytaj wskazane sekcje</text><rect x="960" y="180" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="960" y="180" width="6" height="175" fill="#087f86"/><text x="978" y="215" fill="#17334d" font-size="23" font-weight="700">Jeden czat / jedno ID</text><text x="978" y="252" fill="#547084" font-size="20">Ograniczony cel i zakres</text><text x="978" y="281" fill="#547084" font-size="20">Właściwe testy i logi modułu</text><text x="978" y="310" fill="#547084" font-size="20">Bez kolejnego etapu przy okazji</text><rect x="960" y="450" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="960" y="450" width="6" height="175" fill="#087f86"/><text x="978" y="485" fill="#17334d" font-size="23" font-weight="700">Raport przekazania</text><text x="978" y="522" fill="#547084" font-size="20">HEAD, wersje i zmiany</text><text x="978" y="551" fill="#547084" font-size="20">Dowody / jawne braki</text><text x="978" y="580" fill="#547084" font-size="20">Następny ID i jego pliki</text><rect x="505" y="450" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="505" y="450" width="6" height="175" fill="#087f86"/><text x="523" y="485" fill="#17334d" font-size="23" font-weight="700">Następny czat</text><text x="523" y="522" fill="#547084" font-size="20">Własny odebrany raport</text><text x="523" y="551" fill="#547084" font-size="20">Wersja specyfikacji i artefakty</text><text x="523" y="580" fill="#547084" font-size="20">Bez całej historii rozmowy</text><rect x="50" y="450" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="450" width="6" height="175" fill="#087f86"/><text x="68" y="485" fill="#17334d" font-size="23" font-weight="700">Odbiór etapu</text><text x="68" y="522" fill="#547084" font-size="20">Wszystkie zadania sprawdzone</text><text x="68" y="551" fill="#547084" font-size="20">Zgodne kontrakty i logi</text><text x="68" y="580" fill="#547084" font-size="20">Raport etapu nadrzędnego</text><path d="M440 265L505 265" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M895 265L960 265" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M1155 355L1155 450" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M960 535L895 535" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M505 535L440 535" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="50" y="713" fill="#17334d" font-size="21">A i B mają osobne łańcuchy: wspólna neutralna specyfikacja, własny kod i historia.</text><text x="50" y="749" fill="#17334d" font-size="21">Czat nie uznaje zaplanowanych zależności za wykonane. Brak wejścia blokuje start.</text></g></svg>