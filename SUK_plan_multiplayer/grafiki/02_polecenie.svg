<text x="48" y="90" fill="#c4e6e9" font-size="21">Konto i sterowanie sprawdzamy ponownie przed wykonaniem.</text><rect x="45" y="190" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="45" y="190" width="7" height="170" rx="3" fill="#087f86"/><text x="69" y="232" font-size="25" font-weight="700" fill="#233c51">1  Intencja</text><text x="69" y="272" font-size="22" fill="#587082">requestId + cel</text><text x="69" y="304" font-size="22" fill="#587082">Bez zmiany stanu</text><rect x="387" y="190" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="387" y="190" width="7" height="170" rx="3" fill="#087f86"/><text x="411" y="232" font-size="25" font-weight="700" fill="#233c51">2  Brama</text><text x="411" y="272" font-size="22" fill="#587082">Konto + TLS + limity</text><text x="411" y="304" font-size="22" fill="#587082">Rozpoznanie obiektów</text><rect x="729" y="190" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="729" y="190" width="7" height="170" rx="3" fill="#087f86"/><text x="753" y="232" font-size="25" font-weight="700" fill="#233c51">3  Autoryzacja</text><text x="753" y="272" font-size="22" fill="#587082">Rola, obszar i koniec</text><text x="753" y="304" font-size="22" fill="#587082">Bieżąca epoka praw</text><rect x="1071" y="190" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="1071" y="190" width="7" height="170" rx="3" fill="#087f86"/><text x="1095" y="232" font-size="25" font-weight="700" fill="#233c51">4  Kolejka</text><text x="1095" y="272" font-size="22" fill="#587082">Jedna kolejność</text><text x="1095" y="304" font-size="22" fill="#587082">Bez czekania na sieć</text><path d="M330,275 L387,275" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M672,275 L729,275" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M1014,275 L1071,275" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="45" y="535" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="45" y="535" width="7" height="170" rx="3" fill="#087f86"/><text x="69" y="577" font-size="25" font-weight="700" fill="#233c51">8  Pulpit</text><text x="69" y="617" font-size="22" fill="#587082">Rysuje z meldunków</text><text x="69" y="649" font-size="22" fill="#587082">Sprawdza świeżość</text><rect x="387" y="535" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="387" y="535" width="7" height="170" rx="3" fill="#087f86"/><text x="411" y="577" font-size="25" font-weight="700" fill="#233c51">7  Meldunek</text><text x="411" y="617" font-size="22" fill="#587082">Tick + snapshotId</text><text x="411" y="649" font-size="22" fill="#587082">Stan po wykonaniu</text><rect x="729" y="535" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="729" y="535" width="7" height="170" rx="3" fill="#087f86"/><text x="753" y="577" font-size="25" font-weight="700" fill="#233c51">6  Wynik</text><text x="753" y="617" font-size="22" fill="#587082">Executed / Rejected</text><text x="753" y="649" font-size="22" fill="#587082">Queued ≠ wykonane</text><rect x="1071" y="535" width="285" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="1071" y="535" width="7" height="170" rx="3" fill="#087f86"/><text x="1095" y="577" font-size="25" font-weight="700" fill="#233c51">5  Rdzeń</text><text x="1095" y="617" font-size="22" fill="#587082">KZ sprawdza zależności</text><text x="1095" y="649" font-size="22" fill="#587082">Teren i ruch na serwerze</text><path d="M1213,360 L1213,535" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M387,620 L330,620" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M729,620 L672,620" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M1071,620 L1014,620" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="810" font-size="20" fill="#587082">Wynik komendy i strumień meldunków są powiązane identyfikatorami; sieć nie nadaje skutku srk.</text></g></svg>