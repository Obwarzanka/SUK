<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#087f86"/></marker></defs>
<rect width="1400" height="850" fill="#eef3f7"/><rect width="1400" height="118" fill="#17334d"/>
<g font-family="Arial, sans-serif"><text x="48" y="53" fill="white" font-size="34" font-weight="700">SUK / własny KZ każdego posterunku</text>
<text x="48" y="90" fill="#c4e6e9" font-size="21">Wymaganie właściciela. Wspólny kod algorytmów, oddzielne dane i stan zależności.</text><rect x="50" y="190" width="360" height="230" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="190" width="7" height="230" rx="3" fill="#087f86"/><text x="74" y="232" font-size="25" font-weight="700" fill="#233c51">KZ posterunku A</text><text x="74" y="272" font-size="20" fill="#587082">Dwie grupy: aktywna + rezerwa</text><text x="74" y="304" font-size="20" fill="#587082">Prywatne stany i jeden selektor</text><text x="74" y="336" font-size="22" fill="#587082">Wyłącznie urządzenia A</text><rect x="520" y="220" width="360" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="520" y="220" width="7" height="170" rx="3" fill="#087f86"/><text x="544" y="262" font-size="25" font-weight="700" fill="#233c51">Komunikacja KZ-KZ</text><text x="544" y="302" font-size="22" fill="#587082">Jawne komunikaty blokady</text><text x="544" y="334" font-size="22" fill="#587082">Bez odczytu stanu sąsiada</text><rect x="990" y="190" width="360" height="230" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="990" y="190" width="7" height="230" rx="3" fill="#087f86"/><text x="1014" y="232" font-size="25" font-weight="700" fill="#233c51">KZ posterunku B</text><text x="1014" y="272" font-size="20" fill="#587082">Dwie grupy: aktywna + rezerwa</text><text x="1014" y="304" font-size="20" fill="#587082">Prywatne stany i jeden selektor</text><text x="1014" y="336" font-size="22" fill="#587082">Wyłącznie urządzenia B</text><path d="M410,280 L520,280" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M880,280 L990,280" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M990,345 L880,345" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M520,345 L410,345" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="560" width="900" height="170" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="250" y="560" width="7" height="170" rx="3" fill="#087f86"/><text x="274" y="602" font-size="25" font-weight="700" fill="#233c51">Wspólny teren i ruch na serwerze</text><text x="274" y="642" font-size="22" fill="#587082">Jeden pociąg na granicy posterunków • rozkazy tylko do własnych kart</text><text x="274" y="674" font-size="22" fill="#587082">Wspólny czas i spójna migawka; logicznie oddzielne moduły KZ</text><path d="M230,420 L230,505 L470,505 L470,560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M1170,420 L1170,505 L930,505 L930,560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="700" y="468" text-anchor="middle" font-size="22" fill="#587082">LCS: wspólna obsługa i podgląd wielu odrębnych KZ</text>
<text x="48" y="810" font-size="20" fill="#587082">Moduły mogą działać w jednym procesie Windows. Crash procesu nadal dotyka wszystkie jego moduły.</text></g></svg>