<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10Z" fill="#087f86"/></marker></defs><rect width="1400" height="850" fill="#eef3f7"/><rect width="1400" height="118" fill="#17334d"/><g font-family="Arial,sans-serif"><text x="40" y="52" fill="white" font-weight="700" font-size="31">SUK / logi każdego modułu</text><text x="40" y="91" fill="#c4e6e9" font-size="20">Diagnostyka techniczna ≠ audyt ≠ dziennik odtworzenia ≠ alarm pulpitu</text><rect x="50" y="180" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="180" width="6" height="175" fill="#087f86"/><text x="68" y="215" fill="#17334d" font-size="23" font-weight="700">Moduły C# / aplikacje</text><text x="68" y="252" fill="#547084" font-size="20">ILogger i typowany eventId</text><text x="68" y="281" fill="#547084" font-size="20">Korelacja świata i żądania</text><text x="68" y="310" fill="#547084" font-size="20">Bez sekretów i surowych ramek</text><rect x="50" y="450" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="450" width="6" height="175" fill="#087f86"/><text x="68" y="485" fill="#17334d" font-size="23" font-weight="700">Ada: G1/A B, G2/A B</text><text x="68" y="522" fill="#547084" font-size="20">Bierny DiagnosticBatch</text><text x="68" y="551" fill="#547084" font-size="20">Limit rekordów i bajtów</text><text x="68" y="580" fill="#547084" font-size="20">Bez pliku/sieci w Evaluate</text><rect x="505" y="180" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="505" y="180" width="6" height="175" fill="#087f86"/><text x="523" y="215" fill="#17334d" font-size="23" font-weight="700">Adapter diagnostyki</text><text x="523" y="252" fill="#547084" font-size="20">Schemat, redakcja, poziomy</text><text x="523" y="281" fill="#547084" font-size="20">Ograniczona kolejka + worker</text><text x="523" y="310" fill="#547084" font-size="20">Tick nie czeka na plik</text><rect x="960" y="180" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="960" y="180" width="6" height="175" fill="#087f86"/><text x="978" y="215" fill="#17334d" font-size="23" font-weight="700">Rotowany JSONL</text><text x="978" y="252" fill="#547084" font-size="20">Gotowy sink plikowy</text><text x="978" y="281" fill="#547084" font-size="20">Budżet i retencja / ACL</text><text x="978" y="310" fill="#547084" font-size="20">Drop ma jawny licznik</text><rect x="505" y="450" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="505" y="450" width="6" height="175" fill="#087f86"/><text x="523" y="485" fill="#17334d" font-size="23" font-weight="700">Jedno zatwierdzone wyjście</text><text x="523" y="522" fill="#547084" font-size="20">OutputGate: epoki i effectId</text><text x="523" y="551" fill="#547084" font-size="20">Jeden logiczny skutek</text><text x="523" y="580" fill="#547084" font-size="20">Diagnostyka replik jest osobna</text><rect x="960" y="450" width="390" height="175" rx="14" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="960" y="450" width="6" height="175" fill="#087f86"/><text x="978" y="485" fill="#17334d" font-size="23" font-weight="700">Audyt i commit świata</text><text x="978" y="522" fill="#547084" font-size="20">Odrębna gwarancja trwałości</text><text x="978" y="551" fill="#547084" font-size="20">Bez cichego odrzucania</text><text x="978" y="580" fill="#547084" font-size="20">Applied po właściwym zapisie</text><path d="M440 265L505 265" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M440 535L470 535L470 315L505 315" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M895 265L960 265" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M895 535L960 535" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="50" y="713" fill="#17334d" font-size="21">Wszystkie moduły mają adapter. Jeden skutek świata nie daje czterech wpisów audytu.</text><text x="50" y="749" fill="#17334d" font-size="21">Brak zapisu blokuje nowe wymagające go czynności, nie resetuje już utwierdzonych przebiegów.</text></g></svg>