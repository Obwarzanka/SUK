<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#087f86"/></marker></defs>
<rect width="1400" height="850" fill="#eef3f7"/><rect width="1400" height="118" fill="#17334d"/>
<g font-family="Arial, sans-serif"><text x="48" y="53" fill="white" font-size="34" font-weight="700">SUK / oddanie sterowania z podglądem</text>
<text x="48" y="90" fill="#c4e6e9" font-size="21">Ustalenie właściciela: oddanie prawa nastawczego nie usuwa obserwacji LCS.</text><rect x="50" y="190" width="360" height="200" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="50" y="190" width="7" height="200" rx="3" fill="#087f86"/><text x="74" y="232" font-size="25" font-weight="700" fill="#233c51">Przed przekazaniem: X</text><text x="74" y="272" font-size="22" fill="#587082">Posterunek A</text><text x="74" y="304" font-size="22" fill="#587082">ViewGrant = TAK</text><text x="74" y="336" font-size="22" fill="#587082">ControlLease = TAK</text><rect x="520" y="190" width="360" height="200" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="520" y="190" width="7" height="200" rx="3" fill="#087f86"/><text x="544" y="232" font-size="25" font-weight="700" fill="#233c51">Przekazanie A</text><text x="544" y="272" font-size="22" fill="#587082">Zgoda i Commit serwera</text><text x="544" y="304" font-size="22" fill="#587082">Nowy controlEpoch</text><text x="544" y="336" font-size="22" fill="#587082">Bez resetu KZ</text><rect x="990" y="190" width="360" height="200" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="990" y="190" width="7" height="200" rx="3" fill="#087f86"/><text x="1014" y="232" font-size="25" font-weight="700" fill="#233c51">Po przekazaniu: X</text><text x="1014" y="272" font-size="22" fill="#587082">Podgląd A = TAK</text><text x="1014" y="304" font-size="22" fill="#587082">Sterowanie A = NIE</text><text x="1014" y="336" font-size="22" fill="#587082">Widzi działania Y</text><path d="M410,290 L520,290" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M880,290 L990,290" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="300" y="540" width="800" height="180" rx="16" fill="white" stroke="#c6d4df" stroke-width="2"/><rect x="300" y="540" width="7" height="180" rx="3" fill="#087f86"/><text x="324" y="582" font-size="25" font-weight="700" fill="#233c51">Nowy operator Y i ten sam KZ_A</text><text x="324" y="622" font-size="22" fill="#587082">Y steruje A; X obserwuje aktualne meldunki tego samego modułu</text><text x="324" y="654" font-size="22" fill="#587082">X odzyskuje sterowanie dopiero przez prawidłowe przejęcie</text>
<text x="48" y="810" font-size="20" fill="#587082">ViewGrant i ControlLease są osobne. Podgląd, rola nadzorcy i reconnect nie pozwalają ominąć lease.</text></g></svg>